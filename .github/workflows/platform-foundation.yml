name: Platform foundation qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Linux reference
        if: runner.os == 'Linux'
        run: python tools/platform_reference.py
      - name: Install pinned Windows reference and export templates
        if: runner.os == 'Windows'
        run: python tools/platform_reference.py --windows
      - name: Retain exact source and bind execution
        shell: bash
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git rev-parse 'HEAD^{tree}' > test-results/source-tree.txt
          git archive HEAD > test-results/source.tar
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Every inherited suite, oral memory and new platform checks
        shell: bash
        run: python tools/run_platform_checks.py --godot "$GODOT"
      - name: Four software-rendered platform fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_platform.gd 2>&1 | tee test-results/platform-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/platform-render.log
          grep -q 'PLATFORM_RENDER: 4 captures; 0 failures' test-results/platform-render.log
      - name: Render gameplay-button editor fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_controller_remapping.gd 2>&1 | tee test-results/controller-remapping-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/controller-remapping-render.log
          grep -q 'CONTROLLER_REMAPPING_RENDER: 3 captures; 0 failures' test-results/controller-remapping-render.log
      - name: Render save recovery fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_save_recovery.gd 2>&1 | tee test-results/save-recovery-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/save-recovery-render.log
          grep -q 'SAVE_RECOVERY_RENDER: 3 captures; 0 failures' test-results/save-recovery-render.log
      - name: Render reading accessibility fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_reading_accessibility.gd 2>&1 | tee test-results/reading-accessibility-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/reading-accessibility-render.log
          grep -q 'READING_ACCESSIBILITY_RENDER: 4 captures; 0 failures' test-results/reading-accessibility-render.log
      - name: Render local hardware and store-session fixtures
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_store_integration.gd 2>&1 | tee test-results/store-integration-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/store-integration-render.log
          grep -q 'STORE_INTEGRATION_RENDER: 3 captures; 0 failures' test-results/store-integration-render.log
      - name: Actual Windows export, packaged boot and local staging
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/windows_build.py --godot "$GODOT"
      - name: Collect bounded platform evidence
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['APPDATA']) / 'Godot/app_userdata/1792' if os.name == 'nt' else pathlib.Path.home() / '.local/share/godot/app_userdata/1792'
          target = pathlib.Path('test-results')
          target.mkdir(exist_ok=True)
          for pattern in ('platform-*.png', 'platform-foundation-audit.json', 'platform-remapping-audit.json', 'platform-save-recovery-audit.json', 'platform-reading-audit.json', 'platform-engine-notices.json'):
              for source in root.glob(pattern):
                  shutil.copyfile(source, target / source.name)
      - name: Retain source and conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-evidence-${{ runner.os }}
          path: test-results/
          retention-days: 14
      - name: Retain unsigned Windows development build
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 1792-windows-development
          path: build/1792-windows-development.zip
          retention-days: 14
