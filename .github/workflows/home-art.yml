name: Home visual study qualification
on:
  pull_request:
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/home-art.yml'
permissions:
  contents: read
concurrency:
  group: home-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install existing checksum-pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Full inherited gameplay and visual contracts
        run: |
          python3 tools/run_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          python3 tools/test_check_gujranwala_beauty_capture.py
      - name: Actual renders and compact-window controls
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          python3 tools/capture_home_art.py --xvfb --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --output test-results/home-art-captures
          cp "$HOME/.local/share/godot/app_userdata/1792/home-art-tests.json" test-results/
          mkdir -p test-results/equipment-captures
          export EQUIPMENT_OUTPUT="$PWD/test-results/equipment-captures"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --path game --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --script res://tests/render_service_equipment.gd > test-results/equipment-render.log 2>&1
          cat test-results/equipment-render.log
          if grep -Eq '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/equipment-render.log; then exit 1; fi
          grep -q 'SERVICE_EQUIPMENT_RENDER: 9 captures, 0 failures' test-results/equipment-render.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_gujranwala_beauty.gd 2>&1 | tee test-results/gujranwala-beauty-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/gujranwala-beauty-render.log; then
            exit 1
          fi
          grep -q 'GUJRANWALA_BEAUTY_RENDER: 6 captures; 0 failures' test-results/gujranwala-beauty-render.log
          python3 tools/check_gujranwala_beauty_capture.py \
            --capture-dir "$HOME/.local/share/godot/app_userdata/1792/gujranwala-beauty-images" \
            | tee test-results/gujranwala-beauty-verification.json
          cp -r "$HOME/.local/share/godot/app_userdata/1792/gujranwala-beauty-images" test-results/
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_gujranwala_daily_detail.gd 2>&1 | tee test-results/gujranwala-daily-detail-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/gujranwala-daily-detail-render.log; then exit 1; fi
          grep -q 'GUJRANWALA_DAILY_DETAIL_RENDER: 6 captures; 0 failures' test-results/gujranwala-daily-detail-render.log
          python3 tools/check_gujranwala_daily_detail_capture.py \
            --capture-dir "$HOME/.local/share/godot/app_userdata/1792/gujranwala-daily-detail-images" \
            | tee test-results/gujranwala-daily-detail-verification.json
          cp -r "$HOME/.local/share/godot/app_userdata/1792/gujranwala-daily-detail-images" test-results/
          SOURCE_COMMIT="$(git rev-parse HEAD)" \
            SOURCE_CONTENT_SHA256="$(git archive --format=tar HEAD | sha256sum | cut -d ' ' -f1)" \
            GROUND_FOCUS_OUTPUT="$PWD/test-results/ground-focus-captures" timeout 120 xvfb-run -a \
            "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --path game \
            --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 \
            --script res://tests/render_ground_focus.gd 2>&1 | tee test-results/ground-focus-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/ground-focus-render.log
          grep -q 'GROUND_FOCUS_RENDER: .* captures, 0 failures' test-results/ground-focus-render.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gujranwala-daily-detail-captures
          path: |
            test-results/gujranwala-daily-detail-images/
            test-results/gujranwala-daily-detail-render.log
            test-results/gujranwala-daily-detail-verification.json
          retention-days: 14
      - name: Retain source and execution identity
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git rev-parse HEAD^{tree} > test-results/source-tree.txt
          git archive --format=tar HEAD > test-results/source.tar
          sha256sum "$RUNNER_TEMP/godot.zip" > test-results/runtime-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: home-art-evidence
          path: test-results/
          retention-days: 14
