name: Courtyard source retention
on:
  push:
    branches: [feat/courtyard-authored-v1-20260929]
    paths: [.github/workflows/courtyard-snapshot.yml]
permissions:
  contents: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          mkdir courtyard-source
          git archive --format=tar HEAD > courtyard-source/source.tar
          git rev-parse HEAD > courtyard-source/commit.txt
          git rev-parse HEAD^{tree} > courtyard-source/tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: courtyard-source
          path: courtyard-source/
          retention-days: 14
