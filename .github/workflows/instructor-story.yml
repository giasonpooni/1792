name: Funded instructor in current Home
on:
  pull_request:
    paths: ['game/**', 'tools/**', 'data/production/**', '.github/workflows/instructor-story.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: instructor-story-${{ github.ref }}
  cancel-in-progress: true
jobs:
  instructor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Godot and native software renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
      - name: Composed receipts, retained routes and actual small-screen journey
        run: python3 -u tools/run_instructor_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --native
      - name: Record review identity
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/instructor
          git rev-parse HEAD > test-results/instructor/source-commit.txt
          git rev-parse HEAD^{tree} > test-results/instructor/source-tree.txt
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: instructor-current-home-evidence
          path: test-results/instructor/
          retention-days: 30
