name: Home workshop integration qualification
on:
  pull_request:
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/home-workshop.yml'
permissions:
  contents: read
concurrency:
  group: home-workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  home-workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install existing checksum-pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Full inherited gameplay and visual contracts
        run: python3 tools/run_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Input journey and actual workshop captures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          python3 tools/capture_home_art.py --profile workshop --xvfb --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --output test-results/home-workshop-captures
      - name: Retain source and execution identity
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git rev-parse HEAD^{tree} > test-results/source-tree.txt
          git archive --format=tar HEAD > test-results/source.tar
          sha256sum "$RUNNER_TEMP/godot.zip" > test-results/runtime-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: home-workshop-evidence
          path: test-results/
          retention-days: 14
