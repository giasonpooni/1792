name: Bazaar scene direction
on:
  pull_request:
    paths: ['game/**', 'tools/**', '.github/workflows/bazaar-direction.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bazaar-direction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gameplay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind existing Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Original game regressions and directed journeys
        run: python3 -u tools/run_bazaar_direction.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Actual scene and player-camera observation renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri ffmpeg
          ROPE_REMOUNT_RENDER=1 timeout 180 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/test_rope_remount_integration.gd 2>&1 | tee test-results/rope-remount-integration.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/rope-remount-integration.log; then exit 1; fi
          grep -Eq '^ROPE_REMOUNT_INTEGRATION_TESTS: [1-9][0-9]* passed, 0 failed; [1-9][0-9]* native captures$' test-results/rope-remount-integration.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_remounts.gd 2>&1 | tee test-results/remounts-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/remounts-render.log; then exit 1; fi
          grep -q 'REMOUNTS_RENDER: 8 captures; 0 failures' test-results/remounts-render.log
          mkdir -p test-results/rope-remount-images
          cp "$HOME/.local/share/godot/app_userdata/1792"/rope-remount-*.png test-results/rope-remount-images/
          cp "$HOME/.local/share/godot/app_userdata/1792"/remounts-*.png test-results/rope-remount-images/
          BAZAAR_GUIDANCE_RENDER=1 timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/test_bazaar_guidance.gd 2>&1 | tee test-results/bazaar-guidance.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/bazaar-guidance.log; then exit 1; fi
          grep -Eq '^BAZAAR_GUIDANCE_TESTS: [1-9][0-9]* passed, 0 failed; [1-9][0-9]* native captures$' test-results/bazaar-guidance.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_bazaar_story.gd 2>&1 | tee test-results/bazaar-story-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/bazaar-story-render.log; then exit 1; fi
          grep -Eq '^BAZAAR_STORY_RENDER: [1-9][0-9]* captures; 0 failures$' test-results/bazaar-story-render.log
          mkdir -p test-results/friends-story-images
          cp "$HOME/.local/share/godot/app_userdata/1792"/bazaar-guidance-*.png test-results/friends-story-images/
          cp "$HOME/.local/share/godot/app_userdata/1792"/bazaar-story-*.png test-results/friends-story-images/
          timeout 300 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_bazaar_direction.gd 2>&1 | tee test-results/bazaar-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/bazaar-render.log; then
            exit 1
          fi
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_bazaar_listening.gd 2>&1 | tee test-results/bazaar-listening-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/bazaar-listening-render.log; then
            exit 1
          fi
          grep -q 'BAZAAR_LISTENING_RENDER: 4 captures; 0 failures' test-results/bazaar-listening-render.log
          python3 tools/check_bazaar_presentation_capture.py --user-dir "$HOME/.local/share/godot/app_userdata/1792" > test-results/capture-completeness.json
          cp "$HOME/.local/share/godot/app_userdata/1792/bazaar-listening-checks.json" test-results/
          cp -r "$HOME/.local/share/godot/app_userdata/1792/bazaar-listening-images" test-results/
          cp "$HOME/.local/share/godot/app_userdata/1792/bazaar-direction.json" test-results/
          cp -r "$HOME/.local/share/godot/app_userdata/1792/bazaar-direction-images" test-results/
          ffmpeg -loglevel error -framerate 15 -i test-results/bazaar-direction-images/motion-%03d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart test-results/bazaar-motion.mp4
      - name: Native Gujranwala Slice menu, route and courtyard qualification
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/gujranwala-slice
          export GUJRANWALA_SLICE_OUTPUT="$PWD/test-results/gujranwala-slice"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_gujranwala_slice.gd 2>&1 | tee test-results/gujranwala-slice-render.log
          ! grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/gujranwala-slice-render.log
          grep -q 'GUJRANWALA_SLICE_RENDER: 5 captures; 0 failures' test-results/gujranwala-slice-render.log
      - name: Retain exact source and environment
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git rev-parse HEAD^{tree} > test-results/source-tree.txt
          git archive --format=tar HEAD > test-results/source.tar
          python3 --version > test-results/python.txt
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bazaar-direction-evidence
          path: test-results/
          retention-days: 90
