name: Prepare exact tested town source
on:
  pull_request:
    paths:
      - '_prepare_town_source.py'
      - '.github/workflows/prepare-town-source.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/gujranwala-neighbourhood-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check exact tree and store unreferenced candidate only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.event.pull_request.head.sha }}
        run: python3 _prepare_town_source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-town-prepared-source
          path: town-prepared.json
          if-no-files-found: error
          retention-days: 1
