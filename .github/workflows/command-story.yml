name: Command story checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: command-story-${{ github.ref }}
  cancel-in-progress: true
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned reference Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Structural, import, command, house, riding, companion, naming, childhood and aftermath suites
        run: python3 tools/run_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Software-rendered scene smoke
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          # Preserve reached native captures and saves even if a later renderer
          # fails or times out before its normal evidence-copy boundary.
          trap 'mkdir -p test-results/native-user-data; if [ -d "$HOME/.local/share/godot/app_userdata/1792" ]; then cp -a "$HOME/.local/share/godot/app_userdata/1792/." test-results/native-user-data/; fi' EXIT
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_smoke.gd 2>&1 | tee test-results/render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/render.log; then
            exit 1
          fi
          grep -q 'RENDER_SMOKE: 4 captures attempted; 0 failures' test-results/render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_house_conflict.gd 2>&1 | tee test-results/house-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/house-render.log; then
            exit 1
          fi
          grep -q 'HOUSE_RENDER: 5 captures; 0 failures' test-results/house-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_riding.gd 2>&1 | tee test-results/riding-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/riding-render.log; then
            exit 1
          fi
          grep -q 'RIDING_RENDER: 5 captures; 0 failures' test-results/riding-render.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_companions.gd 2>&1 | tee test-results/companion-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/companion-render.log; then
            exit 1
          fi
          grep -q 'COMPANION_RENDER: 6 captures; 0 failures' test-results/companion-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_character_names.gd 2>&1 | tee test-results/character-names-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/character-names-render.log; then
            exit 1
          fi
          grep -q 'CHARACTER_NAMES_RENDER: 3 captures; 0 failures' test-results/character-names-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_childhood.gd 2>&1 | tee test-results/childhood-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/childhood-render.log; then
            exit 1
          fi
          grep -q 'CHILDHOOD_RENDER: 4 captures; 0 failures' test-results/childhood-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_aftermath.gd 2>&1 | tee test-results/aftermath-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/aftermath-render.log; then
            exit 1
          fi
          grep -q 'AFTERMATH_RENDER: 6 captures; 0 failures' test-results/aftermath-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_gujranwala.gd 2>&1 | tee test-results/gujranwala-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/gujranwala-render.log; then
            exit 1
          fi
          grep -q 'GUJRANWALA_RENDER: 6 captures; 0 failures' test-results/gujranwala-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_reconstruction.gd 2>&1 | tee test-results/reconstruction-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/reconstruction-render.log; then
            exit 1
          fi
          grep -q 'RECONSTRUCTION_RENDER: 4 captures; 0 failures' test-results/reconstruction-render.log
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_water_round.gd 2>&1 | tee test-results/water-round-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/water-round-render.log; then
            exit 1
          fi
          grep -q 'WATER_ROUND_RENDER: 5 captures; 0 failures' test-results/water-round-render.log
          timeout 240 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_horsecraft_study.gd 2>&1 | tee test-results/horsecraft-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/horsecraft-render.log; then
            exit 1
          fi
          grep -q 'HORSECRAFT_RENDER: 5 captures; 0 failures' test-results/horsecraft-render.log
          cp -r "$HOME/.local/share/godot/app_userdata/1792/horsecraft-study-images" test-results/
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_riding_training.gd 2>&1 | tee test-results/riding-training-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/riding-training-render.log; then
            exit 1
          fi
          grep -q 'RIDING_TRAINING_RENDER: 6 captures; 0 failures' test-results/riding-training-render.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_horsecraft_story.gd 2>&1 | tee test-results/horsecraft-story-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/horsecraft-story-render.log; then exit 1; fi
          grep -q 'HORSECRAFT_STORY_RENDER: 5 captures; 0 failures' test-results/horsecraft-story-render.log
          cp -r "$HOME/.local/share/godot/app_userdata/1792/horsecraft-story-images" test-results/
          cp -r "$HOME/.local/share/godot/app_userdata/1792/riding-training-images" test-results/
          timeout 180 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/test_sobraon_prologue.gd -- --capture 2>&1 | tee test-results/sobraon-prologue-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/sobraon-prologue-render.log; then
            exit 1
          fi
          grep -Eq '^SOBRAON_PROLOGUE_TESTS: [1-9][0-9]* passed, 0 failed$' test-results/sobraon-prologue-render.log
          cp -r "$HOME/.local/share/godot/app_userdata/1792/sobraon-opening-images" test-results/
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_charat_campaign_intro.gd 2>&1 | tee test-results/charat-intro-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/charat-intro-render.log; then
            exit 1
          fi
          grep -q 'CHARAT_INTRO_RENDER: 4 captures; 0 failures' test-results/charat-intro-render.log
          cp -r "$HOME/.local/share/godot/app_userdata/1792/charat-intro-images" test-results/
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/test_beginning_guidance.gd 2>&1 | tee test-results/beginning-guidance.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/beginning-guidance.log; then
            exit 1
          fi
          grep -Eq '^BEGINNING_GUIDANCE_TESTS: [1-9][0-9]* passed, 0 failed$' test-results/beginning-guidance.log
          HOUSEHOLD_ATTENTION_RENDER=1 timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/test_household_attention.gd 2>&1 | tee test-results/household-attention.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/household-attention.log; then exit 1; fi
          grep -Eq '^HOUSEHOLD_ATTENTION_TESTS: [1-9][0-9]* passed, 0 failed; 10 captures$' test-results/household-attention.log
          HOUSEHOLD_ACTION_RENDER=1 timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/test_household_action_priority.gd 2>&1 | tee test-results/household-action-priority.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/household-action-priority.log; then exit 1; fi
          grep -Eq '^HOUSEHOLD_ACTION_PRIORITY_TESTS: [1-9][0-9]* passed, 0 failed; 9 captures$' test-results/household-action-priority.log
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_beginning_sequence.gd 2>&1 | tee test-results/beginning-sequence-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/beginning-sequence-render.log; then
            exit 1
          fi
          grep -Eq '^BEGINNING_SEQUENCE_RENDER: 11 captures; [1-9][0-9]* checks; 0 failures$' test-results/beginning-sequence-render.log
          cp -r "$HOME/.local/share/godot/app_userdata/1792/beginning-sequence-images" test-results/
          python3 -m unittest discover -s tools -p 'test_qualify_opening.py'
          for choice in household_escort independent_inquiry; do
            python3 tools/qualify_opening.py \
              --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
              --evidence-dir "test-results/opening-qualified-$choice" \
              --inquiry-choice "$choice" --through-household-task smith-commission --xvfb --timeout 480
            python3 tools/qualify_opening.py \
              --evidence-dir "test-results/opening-qualified-$choice" \
              --inquiry-choice "$choice" --through-household-task smith-commission --verify-only
          done
          timeout 90 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" \
            --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_social_field.gd 2>&1 | tee test-results/social-field-render.log
          if grep -E '^(SCRIPT ERROR|SHADER ERROR|ERROR):' test-results/social-field-render.log; then exit 1; fi
          grep -q 'SOCIAL_FIELD_RENDER: 3 captures; 0 failures' test-results/social-field-render.log
          mkdir -p test-results/screenshots
          cp "$HOME/.local/share/godot/app_userdata/1792/"command-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"house-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"riding-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"companions-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"names-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"childhood-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"aftermath-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"gujranwala-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"reconstruction-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/gujranwala-reconstruction-audit.json" test-results/
          cp "$HOME/.local/share/godot/app_userdata/1792/"water-round-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/water-round-audit.json" test-results/
          cp "$HOME/.local/share/godot/app_userdata/1792/"social-field-*.png test-results/screenshots/
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: command-story-evidence
          path: test-results/
          retention-days: 14
      - name: Retain exact source snapshot for reproducing this prototype
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-snapshot
          include-hidden-files: true
          path: |
            game/**/*.gd
            game/**/*.gdshader
            game/**/*.tscn
            game/**/*.json
            game/project.godot
            tools/
            !tools/**/__pycache__/**
            !tools/**/*.pyc
            schemas/
            data/
            docs/
            README.md
            LICENSE
            CONTRIBUTING.md
            THIRD_PARTY_NOTICES.md
            licenses/
            .github/workflows/command-story.yml
            .gitignore
          retention-days: 14
      - name: Retain independently downloadable escorted journey
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opening-household-escort-evidence
          path: |
            test-results/opening-qualified-household_escort/
            !test-results/opening-qualified-household_escort/isolated-user-data/**
          retention-days: 14
      - name: Retain independently downloadable independent journey
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opening-independent-evidence
          path: |
            test-results/opening-qualified-independent_inquiry/
            !test-results/opening-qualified-independent_inquiry/isolated-user-data/**
          retention-days: 14
