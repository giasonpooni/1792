name: Funded service qualification
on:
  pull_request:
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/funded-service.yml'
permissions:
  contents: read
concurrency:
  group: funded-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  funded-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install existing pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Full inherited and funded-service campaign
        shell: bash
        run: python3 tools/run_commission_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Actual software-rendered service views
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_commissions.gd 2>&1 | tee test-results/commission-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/commission-render.log
          grep -q 'COMMISSION_RENDER: 6 captures; 0 failures' test-results/commission-render.log
          mkdir -p test-results/screenshots
          cp "$HOME/.local/share/godot/app_userdata/1792/"commission-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/commission-journey.json" test-results/
          cp "$HOME/.local/share/godot/app_userdata/1792/"locomotion-route-trace.json test-results/
          cp "$HOME/.local/share/godot/app_userdata/1792/"locomotion-test-summary.json test-results/
      - name: Active contact saves and rendered hand placement
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --fixed-fps 60 --path game --rendering-method gl_compatibility --audio-driver Dummy --script res://tests/render_traversal_contact.gd 2>&1 | tee test-results/traversal-contact-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/traversal-contact-render.log
          grep -q 'TRAVERSAL_CONTACT_RENDER: 5 captures; 0 failures' test-results/traversal-contact-render.log
          cp "$HOME/.local/share/godot/app_userdata/1792/"contact-*.png test-results/screenshots/
          cp "$HOME/.local/share/godot/app_userdata/1792/"traversal-contact-native.json test-results/
      - name: Retain exact source and runtime identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          git rev-parse HEAD^{tree} > test-results/source-tree.txt
          git archive --format=tar HEAD > test-results/source.tar
          sha256sum "$RUNNER_TEMP/godot.zip" > test-results/runtime-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: funded-service-evidence
          path: test-results/
          retention-days: 14
