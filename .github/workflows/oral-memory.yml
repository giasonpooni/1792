name: Oral memory qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oral-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  oral-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install checksum-pinned Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" test-results
          curl --fail --location --retry 3 --max-time 180 \
            'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip' \
            -o "$RUNNER_TEMP/godot.zip"
          echo "02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  $RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Retain exact checked-out source
        run: |
          git rev-parse HEAD > test-results/source-commit.txt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse 'HEAD^{tree}' > test-results/source-tree.txt
          git archive HEAD > test-results/source.tar
      - name: All inherited runtime suites and oral-memory contracts
        run: |
          python3 tools/run_checks.py --godot "$GODOT"
          python3 - <<'PY'
          import os, sys
          from tools.run_checks import run
          run([sys.executable, "tools/check_oral_memory.py"], "oral-memory-content")
          run([os.environ["GODOT"], "--headless", "--fixed-fps", "60", "--path", "game", "--script", "res://tests/test_oral_memory.gd"], "oral-memory", "ORAL_MEMORY_TESTS:")
          PY
      - name: Render oral-memory fixtures
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri
          timeout 120 xvfb-run -a "$GODOT" --path game --rendering-method gl_compatibility --audio-driver Dummy \
            --script res://tests/render_oral_memory.gd 2>&1 | tee test-results/oral-memory-render.log
          ! grep -E '^(SCRIPT ERROR|ERROR):' test-results/oral-memory-render.log
          grep -q 'ORAL_MEMORY_RENDER: 4 captures; 0 failures' test-results/oral-memory-render.log
      - name: Collect observed evidence
        if: always()
        shell: bash
        run: |
          mkdir -p test-results/screenshots
          cp "$HOME/.local/share/godot/app_userdata/1792/"oral-memory-*.png test-results/screenshots/ 2>/dev/null || true
          cp "$HOME/.local/share/godot/app_userdata/1792/oral-memory-audit.json" test-results/ 2>/dev/null || true
      - name: Retain source, logs, trace and actual captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oral-memory-evidence
          path: test-results/
          retention-days: 14
